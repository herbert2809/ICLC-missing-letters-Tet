<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tet Vocabulary Game</title>
    
    <!-- 1. Install Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. Install React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 3. Install Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 4. Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Nunito', sans-serif; user-select: none; background-color: #FFFDF5; }
        .pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1.1); opacity: 1; } }
        .shake { animation: shake 0.4s ease-in-out; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25%, 75% { transform: translateX(-5px); } 50% { transform: translateX(5px); } }
        .drop-zone-active { background-color: #E8F5E9 !important; border-color: #66BB6A !important; transform: scale(1.05); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- SOUND EFFECT UTILITY (Web Audio API - No external files needed) ---
        const playSound = (type) => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                const now = ctx.currentTime;
                
                if (type === 'correct') {
                    // "Ding" sound (High pitch sine wave fade out)
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                    osc.start(now);
                    osc.stop(now + 0.6);
                } else {
                    // "Buzz" sound (Low pitch sawtooth)
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(100, now + 0.2);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            } catch (e) {
                console.error("Audio play failed", e);
            }
        };

        // --- ICON COMPONENTS ---
        const StarIcon = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        );
        const HomeIcon = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        );
        const TrophyIcon = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2h-4a2 2 0 0 0-2 2h0a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v4a6 6 0 0 0 6 6c.38 0 .73-.08 1.06-.2 1.15.7 2.73.7 3.88 0 .33.12.68.2 1.06.2a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2z"></path></svg>
        );
        const ImageIcon = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
        );
        const ArrowRightIcon = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        );
        const MoveIcon = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="5 9 2 12 5 15"></polyline><polyline points="9 5 12 2 15 5"></polyline><polyline points="15 19 12 22 9 19"></polyline><polyline points="19 9 22 12 19 15"></polyline><line x1="2" y1="12" x2="22" y2="12"></line><line x1="12" y1="2" x2="12" y2="22"></line></svg>
        );

        // --- DATA (ENGLISH TRANSLATED) ---
        const QUESTION_DATA = {
          2: [
            { 
              id: 'k2_1', part1: "Chung C", missing: "a", part2: "ke", 
              imageHint: "Chung Cake", 
              imageUrl: "https://vietmartjp.com/wp-content/uploads/2022/12/banh-chung-vietmart-sieu-thi-do-viet-tai-nhat.jpg", 
              options: ["o", "a", "e", "u"] 
            },
            { 
              id: 'k2_2', part1: "N", missing: "e", part2: "w year", 
              imageHint: "New Year", 
              imageUrl: "https://cdn2.fptshop.com.vn/unsafe/800x0/lunar_new_year_la_gi_1_2c62c08926.png", 
              options: ["a", "e", "i", "o"] 
            },
          ],
          3: [
            { 
              id: 'k3_1', part1: "Lucky M", missing: "o", part2: "ney", 
              imageHint: "Lucky Money", 
              imageUrl: "https://vpt-en.b-cdn.net/wp-content/uploads/l/16/li_xi_tet_4_63495d69d0.jpg.webp", 
              options: ["a", "o", "u", "e"] 
            },
            { 
              id: 'k3_2', part1: "Pea", missing: "c", part2: "h blossom", 
              imageHint: "Peach Blossom", 
              imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/9/93/Peach_blossom_2013.jpg/1280px-Peach_blossom_2013.jpg", 
              options: ["s", "k", "c", "t"] 
            },
          ],
          4: [
            { 
              id: 'k4_1', part1: "Firew", missing: "o", part2: "rks", 
              imageHint: "Fireworks", 
              imageUrl: "https://media.thuonghieucongluan.vn/uploads/2025/04/22/h2-1745310274.jpg", 
              options: ["a", "o", "u", "e"] 
            },
            { 
              id: 'k4_2', part1: "Red Enve", missing: "l", part2: "ope", 
              imageHint: "Red Envelope", 
              imageUrl: "https://ducquyencards.com/upload/images/2025/01/1736236214-DQLXKT2483BDocopy.jpg", 
              options: ["l", "n", "m", "h"] 
            },
            { 
              id: 'k4_3', part1: "Celeb", missing: "r", part2: "ate", 
              imageHint: "Celebrate", 
              imageUrl: "https://www.makatimed.net.ph/wp-content/uploads/2021/01/1000-55.png", 
              options: ["l", "r", "n", "t"] 
            },
            { 
              id: 'k4_4', part1: "Re", missing: "u", part2: "nion", 
              imageHint: "Reunion", 
              imageUrl: "https://voca-land.sgp1.cdn.digitaloceanspaces.com/0/1757667552159/98d23b1f.jpg", 
              options: ["a", "o", "u", "e"] 
            },
          ]
        };

        // --- MAIN APP COMPONENT ---
        const App = () => {
            const [currentGrade, setCurrentGrade] = useState(null);
            const [qIndex, setQIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [filledChar, setFilledChar] = useState(null);
            const [gameState, setGameState] = useState('playing'); 
            const [isDraggingOver, setIsDraggingOver] = useState(false);
            const [shuffledOptions, setShuffledOptions] = useState([]);

            const currentQuestions = currentGrade ? QUESTION_DATA[currentGrade] : [];
            const currentQ = currentQuestions[qIndex];

            useEffect(() => {
                if (currentQ) {
                    setShuffledOptions([...currentQ.options].sort(() => Math.random() - 0.5));
                    setFilledChar(null);
                    setGameState('playing');
                }
            }, [currentQ]);

            const handleSelectGrade = (grade) => { setCurrentGrade(grade); setQIndex(0); setScore(0); setGameState('playing'); };
            const goHome = () => { setCurrentGrade(null); setGameState('playing'); };
            
            const checkAnswer = (char) => {
                if (gameState === 'correct') return;
                setFilledChar(char);
                if (char.toLowerCase() === currentQ.missing.toLowerCase()) {
                    setGameState('correct');
                    setScore(s => s + 10);
                    playSound('correct'); // Play correct sound
                } else {
                    setGameState('wrong');
                    playSound('wrong'); // Play wrong sound
                    setTimeout(() => { setFilledChar(null); setGameState('playing'); }, 1000);
                }
            };

            const nextQuestion = () => {
                if (qIndex < currentQuestions.length - 1) {
                    setQIndex(prev => prev + 1);
                } else {
                    setGameState('finished');
                    playSound('correct'); // Celebration sound
                }
            };

            // Drag & Drop
            const onDragStart = (e, char) => e.dataTransfer.setData("char", char);
            const onDragOver = (e) => { e.preventDefault(); setIsDraggingOver(true); };
            const onDragLeave = () => setIsDraggingOver(false);
            const onDrop = (e) => {
                e.preventDefault();
                setIsDraggingOver(false);
                const char = e.dataTransfer.getData("char");
                if (char) checkAnswer(char);
            };

            // RENDER: MENU
            if (!currentGrade) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="max-w-4xl w-full bg-white rounded-3xl shadow-xl p-8 md:p-12 text-center border-4 border-yellow-200">
                            <div className="mb-8">
                                <span className="inline-block bg-red-100 text-red-600 font-bold px-6 py-2 rounded-full mb-4 animate-bounce">🌸 Happy Lunar New Year 🌸</span>
                                <h1 className="text-4xl md:text-6xl font-black text-[#4E342E] mb-2">Word & Play</h1>
                                <p className="text-gray-500 text-lg">Select your grade to start!</p>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                {[2, 3, 4].map((g) => (
                                    <button key={g} onClick={() => handleSelectGrade(g)} className="group relative h-48 rounded-2xl bg-gradient-to-br from-orange-100 to-yellow-50 border-2 border-orange-200 hover:border-red-400 hover:shadow-xl transition-all transform hover:-translate-y-2">
                                        <div className="absolute -top-6 left-1/2 transform -translate-x-1/2 w-12 h-12 bg-red-500 rounded-full flex items-center justify-center text-white font-bold text-xl shadow-md group-hover:bg-red-600">{g}</div>
                                        <div className="flex flex-col items-center justify-center h-full pt-4">
                                            <StarIcon size={40} className="text-yellow-400 mb-2" />
                                            <span className="text-3xl font-black text-orange-800">Grade {g}</span>
                                            <span className="text-sm text-gray-500 font-bold mt-2">{QUESTION_DATA[g].length} Questions</span>
                                        </div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            // RENDER: FINISHED
            if (gameState === 'finished') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="text-center">
                            <TrophyIcon size={80} className="text-yellow-400 mx-auto mb-6 animate-bounce" />
                            <h1 className="text-4xl font-black text-gray-800 mb-2">Congratulations!</h1>
                            <p className="text-xl text-gray-600 mb-8">You completed Grade {currentGrade}</p>
                            <div className="text-6xl font-black text-green-500 mb-10">{score} <span className="text-2xl text-gray-400">points</span></div>
                            <button onClick={goHome} className="bg-red-500 text-white px-8 py-4 rounded-full font-bold text-xl shadow-lg hover:bg-red-600 transition-all flex items-center gap-2 mx-auto">
                                <HomeIcon size={24} /> Back to Home
                            </button>
                        </div>
                    </div>
                );
            }

            // RENDER: GAME
            return (
                <div className="min-h-screen w-full flex items-center justify-center p-4">
                    <div className="w-full max-w-6xl aspect-video bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row relative border-4 border-orange-100">
                        <button onClick={goHome} className="absolute top-4 left-4 z-20 bg-gray-100 p-2 rounded-full hover:bg-gray-200 text-gray-500"><HomeIcon size={20} /></button>

                        {/* LEFT (65%) */}
                        <div className="w-full md:w-[65%] h-full p-6 md:p-10 flex flex-col border-r-2 border-dashed border-red-200 relative">
                            <div className="flex justify-between items-end mb-8 pl-10">
                                <div>
                                    <h2 className="text-gray-400 text-sm font-bold uppercase tracking-widest">Grade {currentGrade} - Q {qIndex + 1}/{currentQuestions.length}</h2>
                                    <div className="h-2 w-32 bg-gray-100 rounded-full mt-2 overflow-hidden"><div className="h-full bg-green-500 transition-all duration-500" style={{ width: `${((qIndex + 1) / currentQuestions.length) * 100}%` }}></div></div>
                                </div>
                                <div className="bg-yellow-100 text-yellow-700 font-bold px-4 py-2 rounded-xl">Score: {score}</div>
                            </div>

                            <div className="flex-1 flex flex-col items-center justify-center space-y-12">
                                <div className="text-5xl md:text-7xl font-black text-[#4E342E] flex items-center gap-2 md:gap-4 flex-wrap justify-center">
                                    <span>{currentQ.part1}</span>
                                    <div 
                                        onDragOver={onDragOver} onDragLeave={onDragLeave} onDrop={onDrop}
                                        className={`w-24 h-24 md:w-32 md:h-32 rounded-2xl border-4 border-dashed flex items-center justify-center transition-all duration-300 relative
                                            ${isDraggingOver ? 'drop-zone-active' : ''}
                                            ${gameState === 'correct' ? 'border-green-500 bg-green-50' : 'border-gray-300 bg-gray-50'}
                                            ${gameState === 'wrong' ? 'border-red-400 bg-red-50 shake' : ''}
                                        `}
                                    >
                                        {filledChar ? (
                                            <span className={`text-6xl md:text-7xl font-black pop-in ${gameState === 'correct' ? 'text-green-600' : 'text-gray-800'} ${gameState === 'wrong' ? 'text-red-500' : ''}`}>{filledChar}</span>
                                        ) : (
                                            <span className="text-gray-300 pointer-events-none opacity-50"><MoveIcon size={32} /></span>
                                        )}
                                        {gameState === 'correct' && <div className="absolute -top-6 -right-6 pop-in"><StarIcon size={40} className="text-yellow-400 drop-shadow-md" /></div>}
                                    </div>
                                    <span>{currentQ.part2}</span>
                                </div>
                                <p className="text-gray-400 font-bold text-sm animate-pulse">{gameState === 'correct' ? "Well done! Click 'Next'!" : "Drag and drop the letter"}</p>
                            </div>

                            <div className="mt-auto pt-6 flex justify-center gap-4 flex-wrap min-h-[100px]">
                                {shuffledOptions.map((char, idx) => (
                                    <div key={`${currentQ.id}-${idx}`} draggable={gameState !== 'correct'} onDragStart={(e) => onDragStart(e, char)} onClick={() => checkAnswer(char)}
                                        className={`w-16 h-16 md:w-20 md:h-20 bg-orange-100 rounded-2xl shadow-[0_5px_0_#E0E0E0] flex items-center justify-center text-3xl font-black text-[#5D4037] transition-transform transform hover:-translate-y-1 hover:shadow-[0_7px_0_#E0E0E0] active:translate-y-1 active:shadow-none ${gameState === 'correct' ? 'opacity-50 cursor-default' : 'draggable-source cursor-grab active:cursor-grabbing'}`}
                                    >
                                        {char}
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* RIGHT (35%) */}
                        <div className="w-full md:w-[35%] h-full bg-yellow-50 p-8 flex flex-col items-center justify-center relative border-l border-white">
                            <div className="absolute top-0 right-0 w-40 h-40 bg-red-100 rounded-full blur-3xl opacity-50 pointer-events-none"></div>
                            <div className="w-56 h-56 bg-white p-3 rounded-3xl shadow-lg border-4 border-white transform rotate-2 mb-6 transition-transform hover:rotate-0 hover:scale-105 duration-300">
                                <div className="w-full h-full bg-gray-100 rounded-2xl flex flex-col items-center justify-center overflow-hidden border-2 border-dashed border-gray-300 relative group">
                                    {currentQ.imageUrl ? <img src={currentQ.imageUrl} alt={currentQ.imageHint} className="w-full h-full object-cover" /> : <div className="flex flex-col items-center"><ImageIcon size={48} className="text-gray-300 mb-2" /><p className="text-gray-400 text-xs font-bold uppercase">Image Clue</p></div>}
                                </div>
                            </div>
                            <div className="h-20 flex items-center justify-center w-full">
                                {gameState === 'correct' ? (
                                    <button onClick={nextQuestion} className="w-full py-4 bg-green-500 hover:bg-green-600 text-white rounded-2xl font-bold text-xl shadow-[0_5px_0_#2E7D32] active:translate-y-1 active:shadow-none transition-all flex items-center justify-center gap-2 pop-in">Next <ArrowRightIcon size={24} /></button>
                                ) : (
                                    <div className="flex flex-col items-center text-gray-400"><span className="text-xs uppercase font-bold tracking-widest mb-1">Status</span><span className="font-bold flex items-center gap-2"><MoveIcon size={16} /> Waiting...</span></div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
